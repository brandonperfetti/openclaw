name: PR 147054 native console proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-console:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - name: Checkout proof driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
      - name: Checkout original contributor baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 2123eaeae601a792c90401b66c5bca4e63356bc1
          path: baseline
          persist-credentials: false
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 866a3722be0984e4a5a1f718a3e11b0c04a59735
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Exercise actual native console control events
        shell: pwsh
        run: |
          ./proof/scripts/proof/pr-147054-native-console.ps1 -Baseline ./baseline -Candidate ./candidate -Evidence ./evidence
      - name: Upload bounded console observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-147054-native-console
          path: evidence/console-proof.json
          retention-days: 1
